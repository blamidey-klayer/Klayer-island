name: NotchBuddy
options:
  bundleIdPrefix: ai.klayer
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: "" # Klayer Apple team ID
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/KlayerIsland.entitlements

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Klayer Island
        CFBundleDisplayName: Klayer Island
        CFBundleIdentifier: ai.klayer.island
        CFBundleVersion: "18"
        CFBundleShortVersionString: "0.3.4"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour sauter au terminal, lire l'adresse de la page ouverte et piloter Spotify."
        NSMicrophoneUsageDescription: "Klayer Island uses the microphone when you dictate a message in the chat."
        NSSpeechRecognitionUsageDescription: "Klayer Island turns your voice into the text of a chat message."
        NSAccessibilityUsageDescription: "Pour lire le titre de la fenêtre active et l'attacher comme contexte, et pour suivre les réponses de l'app Claude."
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.klayer.island
        PRODUCT_NAME: KlayerIsland
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
