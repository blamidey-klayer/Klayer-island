name: NotchBuddy
options:
  bundleIdPrefix: ai.klayer
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

# DebugCloud = Debug, but signed with iCloud (CloudKit) and push entitlements
# and compiled with PHONE_LINK, for the iPhone link spike. ReleaseCloud = the
# same for a Developer ID build with its provisioning profile
# (scripts/cloud-test-build.sh); a Developer ID profile only allows the
# Production CloudKit environment, so the iPhone joins it with the
# KlayerIslandPhoneProduction scheme. Release also compiles PHONE_LINK (the sync
# stays off until turned on in Settings); Debug stays unsigned without it.
configs:
  Debug: debug
  DebugCloud: debug
  Release: release
  ReleaseCloud: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    DebugCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: "" # Klayer Apple team ID
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: "" # Klayer Apple team ID
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/KlayerIsland.entitlements
    ReleaseCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: "" # Klayer Apple team ID
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release
  KlayerIslandAppStore:
    build:
      targets:
        KlayerIslandAppStore: all
    run:
      config: Debug
    archive:
      config: Release
  NotchBuddyCloud:
    build:
      targets:
        NotchBuddy: all
    run:
      config: DebugCloud
    archive:
      config: Release
  KlayerIslandAppStoreCloud:
    build:
      targets:
        KlayerIslandAppStore: all
    run:
      config: DebugCloud
    archive:
      config: Release
  KlayerIslandPhone:
    build:
      targets:
        KlayerIslandPhone: all
    run:
      config: Debug
    archive:
      config: Release
  # Same iPhone app on the Production CloudKit environment, to talk to the
  # Developer ID build (scripts/cloud-test-build.sh), which can only use Production.
  KlayerIslandPhoneProduction:
    build:
      targets:
        KlayerIslandPhone: all
    run:
      config: DebugCloud
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Klayer Island
        CFBundleDisplayName: Klayer Island
        CFBundleIdentifier: ai.klayer.island
        CFBundleVersion: "13"
        CFBundleShortVersionString: "0.2.2"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour sauter au terminal, envoyer des mails et piloter Musique et Spotify."
        NSMicrophoneUsageDescription: "Klayer Island uses the microphone when you dictate a message in the chat."
        NSSpeechRecognitionUsageDescription: "Klayer Island turns your voice into the text of a chat message."
        NSAccessibilityUsageDescription: "Pour lire le titre de la fenêtre active et l'attacher comme contexte."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.klayer.island
        PRODUCT_NAME: KlayerIsland
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PHONE_LINK"
        # The distributed build carries the iPhone sync (off until the user
        # turns it on in Settings), so it needs iCloud and its Developer ID profile.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
          PROVISIONING_PROFILE_SPECIFIER: "Klayer Island Developer ID"
        ReleaseCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
          PROVISIONING_PROFILE_SPECIFIER: "Klayer Island Developer ID"

  KlayerIslandAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Klayer Island
        CFBundleDisplayName: Klayer Island
        CFBundleIdentifier: ai.klayer.KlayerIsland
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.klayer.KlayerIsland
        PRODUCT_NAME: KlayerIsland
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandAppStore.entitlements
        DEVELOPMENT_TEAM: "" # Klayer Apple team ID
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        CODE_SIGNING_ALLOWED: YES
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandAppStoreCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE PHONE_LINK"
        # App Store archive: same iCloud entitlements; Xcode switches push to
        # production when exporting for the App Store.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandAppStoreCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE PHONE_LINK"

  # iPhone app. Same bundle ID as the Mac App Store build, for universal purchase.
  KlayerIslandPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - target: KlayerIslandWidgets
      - target: KlayerIslandNotificationContent
    sources:
      - path: Sources/Phone
        type: group
      # Shared with the Mac targets (they get it through Sources/).
      - path: Sources/KlayerIslandKit
        type: group
      - path: PhoneAssets.xcassets
        buildPhase: resources
      # Klay's sounds for the iPhone's notifications.
      - path: Resources/sounds/approval.wav
        buildPhase: resources
      - path: Resources/sounds/finish.wav
        buildPhase: resources
      - path: Resources/sounds/question.wav
        buildPhase: resources
      - path: Resources/sounds/error.wav
        buildPhase: resources
    info:
      path: Resources/InfoPhone.plist
      properties:
        CFBundleName: Klayer Island
        CFBundleDisplayName: Klayer Island
        CFBundleIdentifier: ai.klayer.KlayerIsland
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: YES
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: YES
        UIBackgroundModes:
          - remote-notification
        # Portrait, except a diff opened full screen (PhoneAppDelegate decides).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: NO
        NSFaceIDUsageDescription: "Klayer Island asks for Face ID before allowing a command from your iPhone."
        NSMicrophoneUsageDescription: "Klayer Island uses the microphone when you dictate an instruction for Claude Code."
        NSSpeechRecognitionUsageDescription: "Klayer Island turns your voice into the text of an instruction for Claude Code."
        NSSupportsLiveActivities: YES
        # Lets Klay move at 120 Hz on ProMotion screens, like the Mac's notch.
        CADisableMinimumFrameDurationOnPhone: YES
        # Steps change often while an agent works: without this, iOS holds back
        # updates once its budget is spent, and "waiting for your OK" came late.
        NSSupportsLiveActivitiesFrequentUpdates: YES
        # klayer://session/<id>: the widgets open a session in the app.
        CFBundleURLTypes:
          - CFBundleURLName: ai.klayer.KlayerIsland
            CFBundleURLSchemes:
              - klayer
        # Which APNs environment the Live Activity tokens belong to (read by the Mac).
        KlayerIslandAPNsEnvironment: $(KLAYER_APNS_ENV)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.klayer.KlayerIsland
        PRODUCT_NAME: KlayerIsland
        INFOPLIST_FILE: Resources/InfoPhone.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Klay in other colors, picked in Settings (UIApplication.setAlternateIconName).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Green AppIcon-Purple AppIcon-Pink AppIcon-Graphite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        KLAYER_APNS_ENV: production
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandPhone.entitlements
        DEVELOPMENT_TEAM: "" # Klayer Apple team ID
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
      configs:
        Debug:
          KLAYER_APNS_ENV: development
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandPhoneProduction.entitlements
          KLAYER_APNS_ENV: development

  # Home Screen and Lock Screen widgets (Solo, Team, List, accessories). They
  # read the sessions the iPhone app saves to the shared App Group.
  KlayerIslandWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Widgets
        type: group
      - path: Sources/KlayerIslandKit
        type: group
      - path: Sources/Phone/SharedSessions.swift
      - path: Sources/Phone/MacStubs.swift
      - path: Sources/Phone/KlayActivityAttributes.swift
      - path: Sources/Phone/OpenLeadKlayIntent.swift
      - path: Sources/Phone/DenyApprovalIntent.swift
    info:
      path: Resources/InfoWidgets.plist
      properties:
        CFBundleName: KlayerIslandWidgets
        CFBundleDisplayName: Klayer Island
        CFBundleIdentifier: ai.klayer.KlayerIsland.Widgets
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.klayer.KlayerIsland.Widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        PRODUCT_NAME: KlayerIslandWidgets
        INFOPLIST_FILE: Resources/InfoWidgets.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/KlayerIslandWidgets.entitlements
        DEVELOPMENT_TEAM: "" # Klayer Apple team ID
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # The expanded approval notification: Klay alive, with the command.
  KlayerIslandNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/NotificationContent
        type: group
      - path: Sources/KlayerIslandKit
        type: group
      - path: Sources/Phone/KlayLive.swift
      - path: Sources/Phone/MacStubs.swift
    info:
      path: Resources/InfoNotificationContent.plist
      properties:
        CFBundleName: KlayerIslandNotificationContent
        CFBundleDisplayName: Klayer Island
        CFBundleIdentifier: ai.klayer.KlayerIsland.NotificationContent
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: KLAYER_APPROVAL
            UNNotificationExtensionInitialContentSizeRatio: 0.45
            UNNotificationExtensionDefaultContentHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.klayer.KlayerIsland.NotificationContent
        PRODUCT_NAME: KlayerIslandNotificationContent
        INFOPLIST_FILE: Resources/InfoNotificationContent.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "" # Klayer Apple team ID
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
