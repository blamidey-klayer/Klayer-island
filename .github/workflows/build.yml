name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test Claude hook detection
        run: bash scripts/test-claude-hooks.sh

      - name: Test hook routing
        run: bash scripts/test-hook-routing.sh

      - name: Test Claude host
        run: bash scripts/test-claude-host.sh

      - name: Test display choice
        run: bash scripts/test-display-choice.sh

      - name: Desktop Klay and gaze tests
        run: bash scripts/test-desktop-klay.sh

      - name: Klay motion tests
        run: bash scripts/test-klay-motion.sh

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test open on hover
        run: bash scripts/test-island-hover.sh

      - name: Test Granola link
        run: bash scripts/test-granola-link.sh

      - name: Test pending request
        run: bash scripts/test-pending-request.sh

      - name: Test approval summary
        run: bash scripts/test-approval-summary.sh

      - name: Test choice history
        run: bash scripts/test-choice-history.sh

      - name: Test session roster
        run: bash scripts/test-session-roster.sh

      - name: Test Code notification
        run: bash scripts/test-code-notification.sh

      - name: Test hook relay
        run: bash scripts/test-hook-relay.sh

      - name: Test Claude app watch
        run: bash scripts/test-claude-app-watch.sh

      - name: Test home layout
        run: bash scripts/test-home-layout.sh

      - name: Test drop sequence
        run: bash scripts/test-upload-sequence.sh

      - name: Test window capture sites
        run: bash scripts/test-window-capture-sites.sh

      - name: Test terminal target
        run: bash scripts/test-terminal-target.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Test Claude CLI
        run: bash scripts/test-claude-cli.sh

      - name: GitHub pulse tests
        run: bash scripts/test-github-pulse.sh

      - name: GitHub activity tests
        run: bash scripts/test-github-activity.sh

      - name: Pill colour tests
        run: bash scripts/test-pill-colors.sh

      - name: Claude settings file tests
        run: bash scripts/test-claude-settings.sh

      - name: Removed feature cleanup tests
        run: bash scripts/test-removed-feature-cleanup.sh

      - name: Shortcut tests
        run: bash scripts/test-shortcuts.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: The shipped binary has no test command
        run: |
          # The test commands exist only in the test build (KLAYER_E2E). The control that this check
          # can see them runs on the test build, two steps below: that build is Debug (-Onone), this
          # one Release (-O), so the control proves the names reach a binary's strings, not that the
          # optimiser keeps them the same way here. The runtime check of the end-to-end step (the
          # Release app answers no test command) covers the rest.
          bin=build/Build/Products/Release/KlayerIsland.app/Contents/MacOS/KlayerIsland
          if [ ! -f "$bin" ]; then
            echo "::error::no Release binary at $bin: nothing to check"
            exit 1
          fi
          found=0
          for f in build/Build/Products/Release/KlayerIsland.app/Contents/MacOS/*; do
            out="$(strings -a "$f")"
            if [ -z "$out" ]; then
              echo "::error::strings printed nothing for $f: the check would pass without reading it"
              exit 1
            fi
            if printf '%s\n' "$out" | grep -E 'e2e_(state|decide|answer|shortcut)'; then
              echo "::error::$f carries test-only commands"
              found=1
            fi
          done
          exit $found

      - name: Package the app (ad-hoc signed, for internal testing)
        run: |
          APP="build/Build/Products/Release/KlayerIsland.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" KlayerIsland-macOS.zip

      - name: Build the end-to-end test app (KLAYER_E2E, never shipped)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Debug \
            -derivedDataPath build-e2e \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) DEBUG KLAYER_E2E'
          # Control of the check above: the test build carries the test commands' names. grep reads
          # all of strings' output (no -q), so strings never writes into a closed pipe.
          strings -a build-e2e/Build/Products/Debug/KlayerIsland.app/Contents/MacOS/* | grep 'e2e_decide' >/dev/null \
            || { echo "::error::the test build has no test command: KLAYER_E2E was not applied"; exit 1; }

      - name: End-to-end island test
        timeout-minutes: 10
        env:
          KLAYER_E2E_RELEASE_APP: build/Build/Products/Release/KlayerIsland.app/Contents/MacOS/KlayerIsland
        run: bash scripts/test-e2e-island.sh

      - name: Upload the end-to-end logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-island-logs
          path: build-e2e/e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: KlayerIsland-macOS
          path: KlayerIsland-macOS.zip
          retention-days: 14
